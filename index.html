<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6B1030">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rakhi">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Happy Raksha Bandhan</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rozha+One&family=Poppins:wght@400;500;600;700&display=swap');

:root {
  --maroon: #6B1030;
  --maroon-deep: #4a0a1f;
  --vermillion: #C81D4F;
  --marigold: #E8A33D;
  --gold: #F4C752;
  --ivory: #FFF8EC;
  --ivory-warm: #FDEFD9;
  --ink: #5a3325;
  --muted: #8a5a45;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  font-family: 'Poppins', sans-serif;
  background: var(--ivory);
  overscroll-behavior-y: none;
}

.screen {
  position: fixed;
  inset: 0;
  overflow-y: auto;
}

/* SPLASH */
#splash {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 32px;
  background: radial-gradient(circle at 50% 30%, var(--maroon) 0%, var(--maroon-deep) 70%);
  transition: opacity 0.6s ease, visibility 0.6s ease;
  z-index: 30;
}
#splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }

.tie-wrap { margin-bottom: 24px; }
.tie-circle {
  fill: none;
  stroke: var(--gold);
  stroke-width: 3;
  stroke-dasharray: 289;
  stroke-dashoffset: 289;
  animation: drawCircle 1.8s ease forwards 0.3s;
}
@keyframes drawCircle { to { stroke-dashoffset: 0; } }

#splash h1 {
  font-family: 'Rozha One', serif;
  font-size: 34px;
  color: #F9E5C9;
  margin: 0 0 8px;
}
#splash p.sub {
  font-size: 13px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--marigold);
  opacity: 0.95;
  margin: 0 0 40px;
}
.enter-btn {
  padding: 14px 32px;
  border: none;
  border-radius: 999px;
  font-family: 'Poppins', sans-serif;
  font-size: 13px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  font-weight: 600;
  background: var(--gold);
  color: var(--maroon-deep);
  box-shadow: 0 8px 24px rgba(0,0,0,0.35);
}

/* HOME */
#home { z-index: 10; background: linear-gradient(180deg, var(--ivory-warm) 0%, var(--ivory) 18%, var(--ivory) 100%); }
#home.hide { display: none; }

.hero {
  padding: 44px 24px 32px;
  text-align: center;
  background: linear-gradient(160deg, var(--maroon) 0%, var(--vermillion) 100%);
  border-bottom-left-radius: 32px;
  border-bottom-right-radius: 32px;
  position: relative;
}
.hero .emoji { font-size: 48px; margin-bottom: 12px; }
.hero h1 {
  font-family: 'Rozha One', serif;
  font-size: 28px;
  color: #F9E5C9;
  margin: 0 0 4px;
}
.hero .tagline {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--gold);
  opacity: 0.85;
  margin: 0 0 8px;
}
.hero p { font-size: 14px; color: var(--gold); opacity: 0.95; margin: 0; padding: 0 16px; }

.audio-toggle {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 36px;
  height: 36px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(249,229,201,0.35);
  color: #F9E5C9;
  font-size: 16px;
}

.eyebrow {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--vermillion);
  text-align: center;
  margin: 28px 0 16px;
}

.card-list { padding: 0 20px; }

.sibling-card {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 16px;
  text-align: left;
  border-radius: 18px;
  padding: 12px;
  margin-bottom: 12px;
  background: var(--ivory);
  border: 1px solid rgba(200,29,79,0.12);
  font-family: inherit;
  opacity: 0;
  animation: riseIn 0.5s ease forwards;
}
.sibling-card:active { transform: scale(0.98); }
@keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.avatar-ring {
  flex-shrink: 0;
  border-radius: 999px;
  padding: 3px;
  background: conic-gradient(from 0deg, var(--gold), var(--vermillion), var(--marigold), var(--gold));
}
.avatar-ring img {
  width: 64px;
  height: 64px;
  border-radius: 999px;
  object-fit: cover;
  border: 2px solid var(--ivory);
  display: block;
}

.sibling-name {
  font-family: 'Rozha One', serif;
  font-size: 18px;
  color: var(--maroon);
}
.sibling-hint {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}
.chevron { color: var(--vermillion); font-size: 20px; margin-left: auto; }

.share-all-wrap { display: flex; justify-content: center; margin: 24px 0 8px; }
.wa-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 28px;
  border-radius: 999px;
  background: #25D366;
  color: white;
  font-weight: 600;
  font-size: 14px;
  text-decoration: none;
  box-shadow: 0 8px 20px rgba(37,211,102,0.3);
}

.footer-note { text-align: center; font-size: 12px; color: #a97a63; margin: 24px 0 40px; }

/* DETAIL */
#detail {
  z-index: 40;
  background: var(--ivory);
  transform: translateY(100%);
  transition: transform 0.35s ease;
}
#detail.show { transform: translateY(0); }

.detail-inner { padding: 24px 20px 60px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.back-btn {
  align-self: flex-start;
  background: none;
  border: none;
  color: var(--vermillion);
  font-family: 'Poppins', sans-serif;
  font-size: 14px;
  padding: 8px 0 24px;
}
.detail-avatar-ring {
  border-radius: 999px;
  padding: 4px;
  background: conic-gradient(from 0deg, var(--gold), var(--vermillion), var(--marigold), var(--gold));
  margin-bottom: 20px;
}
.detail-avatar-ring img {
  width: 144px;
  height: 144px;
  border-radius: 999px;
  object-fit: cover;
  border: 4px solid var(--ivory);
  display: block;
}
.detail-name {
  font-family: 'Rozha One', serif;
  font-size: 30px;
  color: var(--maroon);
  margin: 0 0 16px;
}
.thread-divider { width: 96px; margin: 12px 0 24px; }
.detail-wish {
  font-size: 16px;
  line-height: 1.7;
  color: var(--ink);
  max-width: 340px;
  margin: 0 0 32px;
}

/* Floating petals */
.petal {
  position: fixed;
  top: 100vh;
  pointer-events: none;
  z-index: 5;
  animation: floatUp linear forwards;
}
@keyframes floatUp { to { transform: translateY(-115vh) rotate(360deg); opacity: 0; } }
</style>
</head>

  <div class="tie-wrap">
    <svg width="120" height="120" viewBox="0 0 120 120">

      <text x="60" y="76" text-anchor="middle" font-size="52">🪷</text>
    </svg>
  </div>
  <h1>Raksha Bandhan</h1>
  <p class="sub">A thread of love, tied every year</p>
  <button class="enter-btn" id="enterBtn">Open the thread</button>
</div>

const WHATSAPP_MESSAGE = "Happy Raksha Bandhan! 🪔 Some relationships are made by destiny, but the bond between brothers and sisters is a blessing for life. Wishing you endless happiness, good health and beautiful memories. Sending you lots of love! 💖";

const cardList = document.getElementById('cardList');
SIBLINGS.forEach((s, i) => {
  const card = document.createElement('button');
  card.className = 'sibling-card';
  card.style.animationDelay = (i * 0.08) + 's';
  card.innerHTML = `
    <div class="avatar-ring"><img src="${s.photo}" alt="${s.name}"></div>
    <div>
      <div class="sibling-name">${s.emoji} ${s.name}</div>
      <div class="sibling-hint">Tap to read your wish</div>
    </div>
    <div class="chevron">›</div>
  `;
  card.addEventListener('click', () => openDetail(s));
  cardList.appendChild(card);
});

document.getElementById('shareAllBtn').href =
  'https://wa.me/?text=' + encodeURIComponent(WHATSAPP_MESSAGE);

const detailScreen = document.getElementById('detail');
function openDetail(s) {
  document.getElementById('detailPhoto').src = s.photo;
  document.getElementById('detailPhoto').alt = s.name;
  document.getElementById('detailName').textContent = s.emoji + ' ' + s.name;
  document.getElementById('detailWish').textContent = s.wish;
  const shareText = s.name + ', ' + s.wish + ' 🪔 Happy Raksha Bandhan!';
  document.getElementById('detailShareBtn').href =
    'https://wa.me/?text=' + encodeURIComponent(shareText);
  detailScreen.classList.add('show');
}
document.getElementById('backBtn').addEventListener('click', () => {
  detailScreen.classList.remove('show');
});

document.getElementById('enterBtn').addEventListener('click', enterApp);
function enterApp() {
  document.getElementById('splash').classList.add('hide');
}
setTimeout(enterApp, 3200);

/* Background audio toggle */
const bgAudio = document.getElementById('bgAudio');
const audioToggleBtn = document.getElementById('audioToggle');
let audioOn = false;
audioToggleBtn.addEventListener('click', () => {
  if (audioOn) {
    bgAudio.pause();
    audioToggleBtn.textContent = '🔈';
    audioOn = false;
  } else {
    bgAudio.volume = 0.5;
    bgAudio.play().then(() => {
      audioToggleBtn.textContent = '🔊';
      audioOn = true;
    }).catch(() => {
      audioToggleBtn.textContent = '🔈';
    });
  }
});

/* Floating petals ambient effect */
const petals = ['🌸','🌺','🌷','✨'];
function spawnPetal() {
  const p = document.createElement('div');
  p.className = 'petal';
  p.textContent = petals[Math.floor(Math.random() * petals.length)];
  p.style.left = Math.random() * 100 + 'vw';
  p.style.fontSize = (14 + Math.random() * 14) + 'px';
  p.style.animationDuration = (6 + Math.random() * 5) + 's';
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 12000);
}
setInterval(spawnPetal, 1400);

/* Register service worker for offline / installable behavior */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
